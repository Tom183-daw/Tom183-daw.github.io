<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño de Interfaces Web</title>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h2 class="titulo-principal">Mi primera página</h2>
    </header>

    <main>
        <section class="carrusel-container">
            <div class="carrusel" id="carrusel">
                <div class="carrusel-anillo" id="carruselAnillo">
                    <article class="tarjeta" data-index="0">
                        <h3>Tema 1</h3>
                        <ul>
                            <li>Cuaderno</li>
                            <li>Plantilla</li>
                            <li>Etc..</li>
                        </ul>
                    </article>
                    <article class="tarjeta" data-index="1">
                        <h3>Tema 2</h3>
                        <ul>
                            <li>Cuaderno</li>
                            <li>Plantilla</li>
                            <li>Etc..</li>
                        </ul>
                    </article>
                    <article class="tarjeta" data-index="2">
                        <h3>Tema 3</h3>
                        <ul>
                            <li>Cuaderno</li>
                            <li>Plantilla</li>
                            <li>Etc..</li>
                        </ul>
                    </article>
                    <article class="tarjeta" data-index="3">
                        <h3>Tema 4</h3>
                        <ul>
                            <li>Cuaderno</li>
                            <li>Plantilla</li>
                            <li>Etc..</li>
                        </ul>
                    </article>
                    <article class="tarjeta" data-index="4">
                        <h3>Tema 5</h3>
                        <ul>
                            <li>Cuaderno</li>
                            <li>Plantilla</li>
                            <li>Etc..</li>
                        </ul>
                    </article>
                    <article class="tarjeta" data-index="5">
                        <h3>Tema 6</h3>
                        <ul>
                            <li>Cuaderno</li>
                            <li>Plantilla</li>
                            <li>Etc..</li>
                        </ul>
                    </article>
                </div>
            </div>
            
            <div class="controles">
                <button id="btnAnterior" aria-label="Tema anterior">‹</button>
                <button id="btnSiguiente" aria-label="Tema siguiente">›</button>
            </div>
        </section>
    </main>

    <script src="js/carrusel.js" defer></script>
</body>
</html>
